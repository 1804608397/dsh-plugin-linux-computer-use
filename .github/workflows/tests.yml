name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The tests drive the real server over stdio, and the server imports gi /
      # Atspi, so the system python with the apt bindings is what we run. No
      # display, no /dev/uinput and no accessibility bus are needed: everything
      # that needs a live session is exercised through error paths instead.
      - name: Install the GObject bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0

      - name: Show the interpreter
        run: |
          python3 --version
          python3 -c "import gi; print('gi', gi.__version__)"

      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
